# Local development stack.
#
# Everything a contributor needs to run the platform, and nothing they do not.
# If this file grows a service that is not required to see the app work,
# it belongs somewhere else.
#
#   docker compose up -d
#   docker compose down       # keeps data
#   docker compose down -v    # wipes data, gives you a clean database

name: arctic

services:
  postgres:
    image: postgres:18-alpine
    container_name: arctic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arctic
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: morganhacks
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ stores data in a major-version subdirectory, so the mount
      # goes at /var/lib/postgresql rather than at /data beneath it. Mounting
      # the old path makes the container crash-loop on startup.
      - postgres-data:/var/lib/postgresql
      # Runs once, on an empty data directory only. If you change it, you need
      # `docker compose down -v` for it to take effect again.
      - ./deploy/local/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arctic -d morganhacks"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for resumes. Azurite is Microsoft's own emulator for Azure
  # Blob, which is what the deployed environments use — this replaces the MinIO
  # that stood in for Cloudflare R2 before that decision was made.
  #
  # Emulating the real thing matters more here than it usually does. The part
  # that is easy to get wrong is the signed URL: its expiry, its content type
  # and its disposition are all in the signature, and against an S3-shaped
  # stand-in none of that would be the code that actually runs.
  #
  # Atlas creates the container on first upload when it is pointed at a
  # connection string, so there is nothing to initialise here. In Azure the
  # container comes from Bicep instead, because a service that provisions its
  # own storage is one that keeps working while aimed at the wrong account.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: arctic-azurite
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --location /data
    ports:
      - "10000:10000"   # blob service
    volumes:
      - azurite-data:/data

  # Catches every email the platform sends in local development. Nothing
  # leaves the machine, so a stray send during development can never touch
  # the sending reputation the real domain spends weeks warming up.
  mailpit:
    image: axllent/mailpit:latest
    container_name: arctic-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres-data:
  azurite-data:
