# Put a branch on staging, and optionally force specific services to rebuild.
#
# Run it from the Actions tab, or:
#   gh workflow run deploy-staging.yml -f ref=my-branch -f portalweb=true
#
# Moving staging to a different commit is enough on its own: Vercel rebuilds
# from the push. The per-service switches are for the other case — re-running a
# service when the code has not changed, which a no-op push cannot trigger.
name: Deploy to staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to put on staging"
        required: true
        default: main
        type: string
      portalweb:
        description: "Re-run portalweb even if the commit is unchanged"
        type: boolean
        default: false
      portaladmin:
        description: "Re-run portaladmin on staging"
        type: boolean
        default: false
      portalforms:
        description: "Re-run portalforms on staging"
        type: boolean
        default: false
      atlas:
        description: "Re-run atlas (use deploy-azure.yml instead)"
        type: boolean
        default: false
      lark:
        description: "Re-run lark (use deploy-azure.yml instead)"
        type: boolean
        default: false
      harbor:
        description: "Re-run harbor (use deploy-azure.yml instead)"
        type: boolean
        default: false

concurrency:
  group: sync-staging      # shares the mirror's slot, so they cannot race
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  claim:
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.push.outputs.moved }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Point staging at ${{ inputs.ref }}
        id: push
        run: |
          target=$(git rev-parse HEAD)
          current=$(git ls-remote origin refs/heads/staging | cut -f1)

          echo "requested : ${{ inputs.ref }} ($target)"
          echo "staging is: ${current:-<empty>}"

          if [ "$target" = "$current" ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            echo "staging is already at this commit; no rebuild will be triggered by the push."
          else
            git push --force origin HEAD:refs/heads/staging
            echo "moved=true" >> "$GITHUB_OUTPUT"
            echo "staging moved. Vercel will rebuild portalweb from this push."
          fi

  # One job for all three front ends, because forcing a rebuild is the same act
  # for each and three copies of it would drift.
  #
  # Only needed when the commit did not change, since then the push above
  # triggered nothing and the service has to be told to run again.
  frontends:
    needs: claim
    if: inputs.portalweb || inputs.portaladmin || inputs.portalforms
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the requested front ends
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ needs.claim.outputs.moved }}" = "true" ]; then
            echo "staging already moved to a new commit, so Vercel is rebuilding."
            echo "Nothing further to do."
            exit 0
          fi

          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Forcing a rebuild without a code change needs a Vercel token."
            echo "::error::Add it once:  gh secret set VERCEL_TOKEN -R MorganHacks/Arctic"
            echo "::error::Or push a commit to ${{ inputs.ref }} instead."
            exit 1
          fi

          npm i -g vercel@latest >/dev/null 2>&1

          failed=0
          for app in portalweb portaladmin portalforms; do
            case "$app" in
              portalweb)   want="${{ inputs.portalweb }}" ;;
            esac
            [ "$want" = "true" ] || continue

            project="morganhacks-$app"
            latest=$(vercel ls "$project" --token="$VERCEL_TOKEN" 2>/dev/null \
                     | grep -oE 'https://[a-z0-9.-]+\.vercel\.app' | head -1)

            if [ -z "$latest" ]; then
              echo "::error::$project has no deployment to re-run."
              failed=1
              continue
            fi

            echo "Re-running $project from $latest"
            # A redeploy still runs the project's ignoreCommand, which skips a
            # build when nothing under that app changed. That is right for a
            # push and wrong here, where nothing changing is the whole point --
            # so a cancelled redeploy is reported rather than counted as done.
            if ! vercel redeploy "$latest" --token="$VERCEL_TOKEN"; then
              echo "::error::$project refused the redeploy. If it was cancelled its"
              echo "::error::ignoreCommand skipped it: push a commit touching"
              echo "::error::src/$app or libs/ instead."
              failed=1
            fi
          done

          exit "$failed"

  backends:
    needs: claim
    if: inputs.atlas || inputs.lark || inputs.harbor
    runs-on: ubuntu-latest
    steps:
      - name: Deployed elsewhere
        run: |
          for s in atlas lark harbor; do
            case "$s" in
              atlas)       want="${{ inputs.atlas }}" ;;
              lark)        want="${{ inputs.lark }}" ;;
              harbor)      want="${{ inputs.harbor }}" ;;
            esac
            [ "$want" = "true" ] && echo "  $s: ships through deploy-azure.yml, not from here."
          done
          echo "::error::Nothing was deployed. Use:  gh workflow run deploy-azure.yml -f environment=staging"
          exit 1
