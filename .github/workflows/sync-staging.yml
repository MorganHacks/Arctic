# Keeps staging in step with main.
#
# The flow is feature -> staging -> main, so after something lands on main
# staging is usually behind by exactly the merge commit. Left alone the two
# drift, and once they drift staging stops predicting what production will do,
# which is the only reason to have it.
name: Sync staging

on:
  push:
    branches: [main]

# Never let two of these race; the second would push a stale tree.
concurrency:
  group: sync-staging
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging
          # Full history: a shallow clone cannot work out whether main is
          # already an ancestor of staging.
          fetch-depth: 0

      - name: Update staging from main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git merge --ff-only origin/main; then
            echo "Fast-forwarded staging to main."
          elif git merge --no-edit origin/main -m "Merge main into staging"; then
            # staging had commits of its own — work someone pushed there that
            # has not reached main yet. Merging keeps it rather than throwing
            # it away, which a force push would have done silently.
            echo "staging had its own commits; merged main into it."
          else
            echo "::error::staging and main conflict. Resolve it by hand:"
            echo "::error::  git checkout staging && git merge main"
            exit 1
          fi

          git push origin HEAD:staging
